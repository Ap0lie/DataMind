[project]
name = "datamind"
version = "0.1.0"
description = "AI Data Analysis Copilot based on LangGraph and MCP."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14.0",
    "anyio>=4.4.0",
    "argon2-cffi>=23.1.0",
    "celery[redis]>=5.4.0",
    "duckdb>=1.0.0",
    "docker>=7.1.0",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "ijson>=3.3.0",
    "langmem==0.0.30",
    "langgraph>=1.2.11,<2.0.0",
    "langgraph-checkpoint-postgres>=2.0.0",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "openpyxl>=3.1.0",
    "pandas>=2.2.0",
    "pillow>=10.4.0",
    "plotly>=5.23.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "pypdf>=4.3.0",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0.0",
    "sqlglot>=25.0.0",
    "psycopg[binary,pool]>=3.2.0",
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-exporter-otlp-proto-http>=1.27.0",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
semantic = [
    "sentence-transformers>=3.0.0",
    "huggingface-hub>=0.25.0",
]
dev = [
    "httpx2>=2.9.1,<3.0.0",
    "mypy>=1.11.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.6.0",
]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--strict-markers -m unit"
markers = [
    "unit: fast isolated tests without FastAPI startup, background threads, or Python subprocesses",
    "workflow: real LangGraph orchestration with mocked model and Python execution boundaries",
    "integration: FastAPI, temporary SQLite, DuckDB, and mocked service integration tests",
    "sandbox: real Python subprocess, timeout, isolation, and optional Docker Runner tests",
    "benchmark: explicit project benchmark harness and release-gate scenarios",
    "e2e: browser-driven Playwright end-to-end tests",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]
ignore = [
    "E501",  # Long lines are left to the formatter and improve readability in prompts/fixtures.
    "RUF001",  # Full-width punctuation is intentional in Chinese user-facing text.
]

[tool.ruff.lint.per-file-ignores]
"app/api/**/*.py" = ["B008"]  # FastAPI uses File/Form/Depends calls as parameter markers.

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
