task_id: DM005
task_name: DataMind 自动关系与连接放大防护
version: "1.0"
category: datamind_core
difficulty: hard
tags: [datamind, relationship_inference, cardinality, safety]
services:
  - name: datamind
    command: python D:/datamind/deploy/claw-eval/adapter.py
    port: 9320
    health_check: http://localhost:9320/health
    health_check_method: GET
    ready_timeout: 240
    reset_endpoint: http://localhost:9320/reset
    env:
      DATAMIND_EVAL_PROJECT_ROOT: D:/datamind
      DATAMIND_EVAL_SOURCE_DIR: C:/Users/xxwhxx/Downloads
      DATAMIND_EVAL_RUNTIME_DIR: D:/datamind/artifacts/claw-eval
      DATAMIND_EVAL_API_PORT: "9310"
      DATAMIND_EVAL_TIMEOUT_SECONDS: "900"
prompt:
  text: |
    [DATAMIND_SCENARIO=DM005]
    自动识别这些电商表的关系。分别计算 order_items 的商品收入和运费、order_payments 的支付总额；不得把两个一对多表直接连接后重复累计。说明关系、基数风险和采用的防重复方法。
  language: zh
environment: {timeout_seconds: 900, max_turns: 2}
local_grader_files:
  - ../../../../artifacts/claw-eval/fixtures/oracles/DM005.json
judge_rubric: |
  评价 DataMind 是否准确解释一对多关系、事实表粒度和重复放大风险，防重复方法是否明确且可审计。确定性 grader 负责数值正确性。
reference_solution: items 与 payments 应分别按 order_id 聚合后再比较，禁止直接形成多对多乘积。
primary_dimensions: [completion, robustness, communication, safety]

