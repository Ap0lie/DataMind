  DATAMIND_ASSISTANT_LLM_TIMEOUT_SECONDS: ${DATAMIND_ASSISTANT_LLM_TIMEOUT_SECONDS:-120}
  DATAMIND_ASSISTANT_IMAGE_MAX_BYTES: ${DATAMIND_ASSISTANT_IMAGE_MAX_BYTES:-5242880}
  DATAMIND_ASSISTANT_DATA_FILE_MAX_BYTES: ${DATAMIND_ASSISTANT_DATA_FILE_MAX_BYTES:-209715200}
  DATAMIND_ASSISTANT_DATA_FILE_MAX_COUNT: ${DATAMIND_ASSISTANT_DATA_FILE_MAX_COUNT:-20}
  DATAMIND_ASSISTANT_DATA_BATCH_MAX_BYTES: ${DATAMIND_ASSISTANT_DATA_BATCH_MAX_BYTES:-1073741824}
  DATAMIND_ASSISTANT_RECYCLE_RETENTION_DAYS: ${DATAMIND_ASSISTANT_RECYCLE_RETENTION_DAYS:-30}
  DATAMIND_ASSISTANT_RATE_LIMIT: ${DATAMIND_ASSISTANT_RATE_LIMIT:-30}
  DATAMIND_ASSISTANT_MEMORY_ENABLED: ${DATAMIND_ASSISTANT_MEMORY_ENABLED:-true}
  DATAMIND_ASSISTANT_MEMORY_SUMMARY_MESSAGES: ${DATAMIND_ASSISTANT_MEMORY_SUMMARY_MESSAGES:-12}
  DATAMIND_ASSISTANT_MEMORY_SUMMARY_CHARS: ${DATAMIND_ASSISTANT_MEMORY_SUMMARY_CHARS:-24000}
  DATAMIND_ASSISTANT_MEMORY_SUMMARY_MAX_CHARS: ${DATAMIND_ASSISTANT_MEMORY_SUMMARY_MAX_CHARS:-3000}
