  DATAMIND_ASSISTANT_MEMORY_CONTEXT_CHARS: ${DATAMIND_ASSISTANT_MEMORY_CONTEXT_CHARS:-4000}
  DATAMIND_ASSISTANT_MEMORY_TTL_DAYS: ${DATAMIND_ASSISTANT_MEMORY_TTL_DAYS:-180}
  DATAMIND_ASSISTANT_MEMORY_RECYCLE_DAYS: ${DATAMIND_ASSISTANT_MEMORY_RECYCLE_DAYS:-30}
  DATAMIND_ASSISTANT_MEMORY_TIMEOUT_SECONDS: ${DATAMIND_ASSISTANT_MEMORY_TIMEOUT_SECONDS:-10}
  DATAMIND_ASSISTANT_MEMORY_RELEVANCE_THRESHOLD: ${DATAMIND_ASSISTANT_MEMORY_RELEVANCE_THRESHOLD:-0.32}
  DATAMIND_ASSISTANT_MEMORY_PREFILTER_LIMIT: ${DATAMIND_ASSISTANT_MEMORY_PREFILTER_LIMIT:-100}
  DATAMIND_ASSISTANT_MEMORY_MMR_LAMBDA: ${DATAMIND_ASSISTANT_MEMORY_MMR_LAMBDA:-0.75}
  DATAMIND_ASSISTANT_MEMORY_EXPERIENCE_ENABLED: ${DATAMIND_ASSISTANT_MEMORY_EXPERIENCE_ENABLED:-true}
  DATAMIND_ASSISTANT_MEMORY_MODEL_EXTRACTION_ENABLED: ${DATAMIND_ASSISTANT_MEMORY_MODEL_EXTRACTION_ENABLED:-true}
  DATAMIND_ASSISTANT_MEMORY_AUTO_DORMANCY_ENABLED: ${DATAMIND_ASSISTANT_MEMORY_AUTO_DORMANCY_ENABLED:-false}
  DATAMIND_ASSISTANT_MEMORY_DORMANCY_THRESHOLD: ${DATAMIND_ASSISTANT_MEMORY_DORMANCY_THRESHOLD:-0.25}
  DATAMIND_ASSISTANT_MEMORY_DORMANCY_MIN_FEEDBACK: ${DATAMIND_ASSISTANT_MEMORY_DORMANCY_MIN_FEEDBACK:-3}
  DATAMIND_ASSISTANT_MEMORY_WRONG_FEEDBACK_LIMIT: ${DATAMIND_ASSISTANT_MEMORY_WRONG_FEEDBACK_LIMIT:-2}
  DATAMIND_OTEL_EXPORTER_OTLP_ENDPOINT: ${DATAMIND_OTEL_EXPORTER_OTLP_ENDPOINT:-}
  DATAMIND_SEMANTIC_EMBEDDING_ENABLED: ${DATAMIND_SEMANTIC_EMBEDDING_ENABLED:-true}
  DATAMIND_SEMANTIC_EMBEDDING_REQUIRED: ${DATAMIND_SEMANTIC_EMBEDDING_REQUIRED:-true}
  DATAMIND_SEMANTIC_EMBEDDING_MODEL_PATH: /opt/datamind/models/bge-small-zh-v1.5
  DATAMIND_SEMANTIC_EMBEDDING_REVISION: 4e17e244a0fb63bfb78fca8fcf95079fcc664f5c
  DATAMIND_SEMANTIC_EMBEDDING_LOCAL_FILES_ONLY: "true"
  DATAMIND_SEMANTIC_EMBEDDING_DEVICE: cpu
  DATAMIND_SEMANTIC_EMBEDDING_BATCH_SIZE: "32"
