  DATAMIND_LLM_PROMPT_MAX_CHARS: ${DATAMIND_LLM_PROMPT_MAX_CHARS:-120000}
  DATAMIND_CONTEXT_BUDGET_ENABLED: ${DATAMIND_CONTEXT_BUDGET_ENABLED:-true}
  DATAMIND_CONTEXT_BUDGET_MODE: ${DATAMIND_CONTEXT_BUDGET_MODE:-shadow}
  DATAMIND_LLM_CONTEXT_WINDOW_TOKENS: ${DATAMIND_LLM_CONTEXT_WINDOW_TOKENS:-65536}
  DATAMIND_CONTEXT_SAFETY_RATIO: ${DATAMIND_CONTEXT_SAFETY_RATIO:-0.15}
  DATAMIND_DATASET_UPLOAD_MAX_BYTES: ${DATAMIND_DATASET_UPLOAD_MAX_BYTES:-209715200}
  DATAMIND_ASSISTANT_ENABLED: ${DATAMIND_ASSISTANT_ENABLED:-true}
