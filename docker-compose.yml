  DATAMIND_ASSISTANT_ASK_MAX_TOKENS: ${DATAMIND_ASSISTANT_ASK_MAX_TOKENS:-4096}
  DATAMIND_ASSISTANT_EXECUTE_MAX_TOKENS: ${DATAMIND_ASSISTANT_EXECUTE_MAX_TOKENS:-8192}
  DATAMIND_ASSISTANT_COMPLETION_TOTAL_MAX_TOKENS: ${DATAMIND_ASSISTANT_COMPLETION_TOTAL_MAX_TOKENS:-24576}
