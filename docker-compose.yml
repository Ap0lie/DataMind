  DATAMIND_AGENT_LOOP_DEFAULT_MODE: ${DATAMIND_AGENT_LOOP_DEFAULT_MODE:-loop}
  DATAMIND_AGENT_LOOP_ALLOW_REQUEST_OVERRIDE: ${DATAMIND_AGENT_LOOP_ALLOW_REQUEST_OVERRIDE:-true}
  DATAMIND_AGENT_LOOP_PROVIDER: ${DATAMIND_AGENT_LOOP_PROVIDER:-deepseek}
  DATAMIND_AGENT_LOOP_MODEL: ${DATAMIND_AGENT_LOOP_MODEL:-deepseek-chat}
  DATAMIND_AGENT_LOOP_MAX_TOOL_CALLS: ${DATAMIND_AGENT_LOOP_MAX_TOOL_CALLS:-12}
  DATAMIND_AGENT_LOOP_MAX_DECISIONS: ${DATAMIND_AGENT_LOOP_MAX_DECISIONS:-16}
  DATAMIND_AGENT_LOOP_MAX_TOOL_ATTEMPTS: ${DATAMIND_AGENT_LOOP_MAX_TOOL_ATTEMPTS:-3}
  DATAMIND_AGENT_LOOP_TIMEOUT_SECONDS: ${DATAMIND_AGENT_LOOP_TIMEOUT_SECONDS:-300}
  DATAMIND_AGENT_LOOP_MAX_TOKENS: ${DATAMIND_AGENT_LOOP_MAX_TOKENS:-50000}
