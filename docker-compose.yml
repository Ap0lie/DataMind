name: ${COMPOSE_PROJECT_NAME:-datamind}

x-datamind-app: &datamind-app
  image: ${DATAMIND_APP_IMAGE:-datamind-app}:${DATAMIND_IMAGE_TAG:-latest}
  build:
    context: .
    dockerfile: Dockerfile
    args:
      DATAMIND_BUILD_SHA: ${DATAMIND_BUILD_SHA:-local}
      PYPI_INDEX_URL: ${DATAMIND_PYPI_INDEX_URL:-https://pypi.org/simple}

x-datamind-environment: &datamind-environment
  DATAMIND_ENVIRONMENT: production
  DATAMIND_DATABASE_URL: postgresql+psycopg://datamind:${DATAMIND_POSTGRES_PASSWORD:?Set DATAMIND_POSTGRES_PASSWORD}@postgres:5432/datamind
  DATAMIND_REDIS_URL: redis://:${DATAMIND_REDIS_PASSWORD:?Set DATAMIND_REDIS_PASSWORD}@redis:6379/0
  DATAMIND_EXECUTION_BACKEND: celery
  DATAMIND_CHECKPOINT_BACKEND: postgres
  DATAMIND_AUTH_MODE: session
  DATAMIND_SESSION_COOKIE_SECURE: "true"
  DATAMIND_CORS_ORIGINS: ${DATAMIND_PUBLIC_ORIGIN:-https://localhost}
  DATAMIND_ALLOW_MCP_INVOKE: "false"
  DATAMIND_RATE_LIMITS_ENABLED: "true"
  DATAMIND_DATASET_STORE_PATH: /data/datasets
  DATAMIND_PYTHON_RUNNER_URL: http://python-runner:8020
  DATAMIND_PYTHON_RUNNER_SHARED_SECRET: ${DATAMIND_PYTHON_RUNNER_SHARED_SECRET:?Set DATAMIND_PYTHON_RUNNER_SHARED_SECRET}
  DATAMIND_PYTHON_RUNNER_CONTAINER_TIMEOUT_SECONDS: ${DATAMIND_PYTHON_RUNNER_CONTAINER_TIMEOUT_SECONDS:-30}
  DATAMIND_PYTHON_SANDBOX_IMAGE: ${DATAMIND_SANDBOX_IMAGE:-datamind-python-sandbox:latest}
  DATAMIND_LLM_PROVIDER: ${DATAMIND_LLM_PROVIDER:-}
  DATAMIND_DEFAULT_LLM_PROVIDER: ${DATAMIND_DEFAULT_LLM_PROVIDER:-deepseek}
  DATAMIND_CLEANING_LLM_PROVIDER: ${DATAMIND_CLEANING_LLM_PROVIDER:-deepseek}
  DATAMIND_PLANNER_LLM_PROVIDER: ${DATAMIND_PLANNER_LLM_PROVIDER:-deepseek}
  DATAMIND_SQL_LLM_PROVIDER: ${DATAMIND_SQL_LLM_PROVIDER:-deepseek}
  DATAMIND_PYTHON_LLM_PROVIDER: ${DATAMIND_PYTHON_LLM_PROVIDER:-deepseek}
  DATAMIND_REFLECTION_LLM_PROVIDER: ${DATAMIND_REFLECTION_LLM_PROVIDER:-deepseek}
  DATAMIND_REPORT_LLM_PROVIDER: ${DATAMIND_REPORT_LLM_PROVIDER:-kimi}
  DATAMIND_REVIEW_LLM_PROVIDER: ${DATAMIND_REVIEW_LLM_PROVIDER:-kimi}
  DATAMIND_MULTIMODAL_LLM_PROVIDER: ${DATAMIND_MULTIMODAL_LLM_PROVIDER:-kimi}
  DATAMIND_LLM_MODEL: ${DATAMIND_LLM_MODEL:-deepseek-chat}
  DATAMIND_DEEPSEEK_MODEL: ${DATAMIND_DEEPSEEK_MODEL:-deepseek-chat}
  DATAMIND_KIMI_MODEL: ${DATAMIND_KIMI_MODEL:-kimi-k2.6}
  DATAMIND_LLM_BASE_URL: ${DATAMIND_LLM_BASE_URL:-}
  DATAMIND_DEEPSEEK_BASE_URL: ${DATAMIND_DEEPSEEK_BASE_URL:-https://api.deepseek.com}
  DATAMIND_KIMI_BASE_URL: ${DATAMIND_KIMI_BASE_URL:-https://api.moonshot.cn/v1}
  DATAMIND_LLM_API_KEY: ${DATAMIND_LLM_API_KEY:-}
  DATAMIND_DEEPSEEK_API_KEY: ${DATAMIND_DEEPSEEK_API_KEY:-}
  DATAMIND_KIMI_API_KEY: ${DATAMIND_KIMI_API_KEY:-}
  DATAMIND_LLM_TIMEOUT_SECONDS: ${DATAMIND_LLM_TIMEOUT_SECONDS:-30}
