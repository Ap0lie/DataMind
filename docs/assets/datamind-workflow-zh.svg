<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="716" viewBox="0 0 1400 716" role="img" aria-labelledby="title desc">
  <title id="title">DataMind 端到端流程</title>
  <desc id="desc">从数据准备到自主分析、验证、报告和 Kimi 后续操作的完整流程。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748b"/>
    </marker>
    <style>
      text { font-family: Inter, "Segoe UI", "Microsoft YaHei", Arial, sans-serif; }
      .layer { font-size: 18px; font-weight: 700; fill: #0f172a; }
      .card-title { font-weight: 700; }
      .card-detail { font-size: 15px; font-weight: 500; }
      .arrow { stroke: #64748b; stroke-width: 2; fill: none; }
      .arrow.muted { stroke: #94a3b8; stroke-width: 1.7; }
      .shared-connection { stroke: #64748b; stroke-width: 1.7; fill: none; }
      .flow-label { font-size: 14px; font-weight: 700; fill: #475569; }
      .service-bus { font-size: 14px; font-weight: 700; fill: #334155; }
    </style>
  </defs>
  <rect width="1400" height="716" fill="#ffffff"/>

    <rect x="16" y="16" width="1368" height="180" rx="8" fill="#f8fffc" stroke="#dbe4ef"/>
    <text x="34" y="43" class="layer">1 · 准备可信数据</text>
<rect x="230" y="204" width="940" height="28" rx="8" fill="#eff6ff" stroke="#60a5fa"/>
<text x="700" y="223" text-anchor="middle" class="service-bus" fill="#1e3a8a">所有模型调用 · 节点 Harness → 预算评估 → 确定性压缩 → Router 门禁</text>

    <rect x="16" y="242" width="1368" height="260" rx="8" fill="#fbfdfc" stroke="#dbe4ef"/>
    <text x="34" y="269" class="layer">2 · 有边界的自主分析</text>

    <rect x="16" y="517" width="1368" height="183" rx="8" fill="#fafbff" stroke="#dbe4ef"/>
    <text x="34" y="544" class="layer">3 · 交付证据化答案</text>

    <rect x="63" y="66" width="290" height="105" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="208" y="102" text-anchor="middle" class="card-title" font-size="19" fill="#064e3b">导入文件</text>
    <text text-anchor="middle" class="card-detail" fill="#064e3b"><tspan x="208" y="132">批量 · 拖拽上传</tspan><tspan x="208" y="153">大文件落盘暂存</tspan></text>

    <rect x="388" y="66" width="290" height="105" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
    <text x="533" y="102" text-anchor="middle" class="card-title" font-size="19" fill="#14532d">清洗 Loop</text>
    <text text-anchor="middle" class="card-detail" fill="#14532d"><tspan x="533" y="132">规则 · LLM · Hybrid</tspan><tspan x="533" y="153">修复 · 质量门禁</tspan></text>

    <rect x="713" y="66" width="290" height="105" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
    <text x="858" y="102" text-anchor="middle" class="card-title" font-size="19" fill="#78350f">可信清洗版本</text>
    <text text-anchor="middle" class="card-detail" fill="#78350f"><tspan x="858" y="132">Diff · 激活 · 回滚</tspan><tspan x="858" y="153">失败不覆盖当前版本</tspan></text>

    <rect x="1038" y="66" width="290" height="105" rx="8" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
    <text x="1183" y="102" text-anchor="middle" class="card-title" font-size="19" fill="#1e3a8a">画像与语义</text>
    <text text-anchor="middle" class="card-detail" fill="#1e3a8a"><tspan x="1183" y="132">漂移 · 角色 · 指标</tspan><tspan x="1183" y="153">实体关系图</tspan></text>

    <rect x="22" y="292" width="216" height="130" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
    <text x="130" y="328" text-anchor="middle" class="card-title" font-size="18" fill="#78350f">意图 Guard</text>
    <text text-anchor="middle" class="card-detail" fill="#78350f"><tspan x="130" y="358">编译 · 极性校验</tspan><tspan x="130" y="379">修复 · 用户确认</tspan></text>

    <rect x="250" y="292" width="216" height="130" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
    <text x="358" y="328" text-anchor="middle" class="card-title" font-size="18" fill="#14532d">Planner</text>
    <text text-anchor="middle" class="card-detail" fill="#14532d"><tspan x="358" y="358">问题 · 范围 · 粒度</tspan><tspan x="358" y="379">分析契约</tspan></text>

    <rect x="478" y="292" width="216" height="130" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
    <text x="586" y="328" text-anchor="middle" class="card-title" font-size="18" fill="#14532d">工具 Loop</text>
    <text text-anchor="middle" class="card-detail" fill="#14532d"><tspan x="586" y="358">安全 SQL · Python</tspan><tspan x="586" y="379">证据 Artifact</tspan></text>

    <rect x="706" y="292" width="216" height="130" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
    <text x="814" y="328" text-anchor="middle" class="card-title" font-size="18" fill="#78350f">验证器</text>
    <text text-anchor="middle" class="card-detail" fill="#78350f"><tspan x="814" y="358">Join 粒度 · 统计</tspan><tspan x="814" y="379">数值证据</tspan></text>

    <rect x="934" y="292" width="216" height="130" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
    <text x="1042" y="328" text-anchor="middle" class="card-title" font-size="18" fill="#78350f">Reviewer</text>
    <text text-anchor="middle" class="card-detail" fill="#78350f"><tspan x="1042" y="358">对抗审查</tspan><tspan x="1042" y="379">失败触发重规划</tspan></text>

    <rect x="1162" y="292" width="216" height="130" rx="8" fill="#faf5ff" stroke="#c084fc" stroke-width="2"/>
    <text x="1270" y="328" text-anchor="middle" class="card-title" font-size="18" fill="#581c87">报告 Loop</text>
    <text text-anchor="middle" class="card-detail" fill="#581c87"><tspan x="1270" y="358">草稿 · 修复 · 验证</tspan><tspan x="1270" y="379">幂等提交</tspan></text>

    <rect x="200" y="567" width="300" height="110" rx="8" fill="#faf5ff" stroke="#c084fc" stroke-width="2"/>
    <text x="350" y="603" text-anchor="middle" class="card-title" font-size="19" fill="#581c87">报告资产</text>
    <text text-anchor="middle" class="card-detail" fill="#581c87"><tspan x="350" y="633">图表 · 血缘 · 版本</tspan><tspan x="350" y="654">HTML · Markdown · PDF</tspan></text>

    <rect x="550" y="567" width="300" height="110" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="700" y="603" text-anchor="middle" class="card-title" font-size="19" fill="#064e3b">Kimi 助手</text>
    <text text-anchor="middle" class="card-detail" fill="#064e3b"><tspan x="700" y="633">证据 · 范围记忆</tspan><tspan x="700" y="654">问答 · 执行 · 附件</tspan></text>

    <rect x="900" y="567" width="300" height="110" rx="8" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
    <text x="1050" y="603" text-anchor="middle" class="card-title" font-size="19" fill="#1e3a8a">后续行动</text>
    <text text-anchor="middle" class="card-detail" fill="#1e3a8a"><tspan x="1050" y="633">追问 · 重新分析</tspan><tspan x="1050" y="654">可审计 · 可恢复</tspan></text>
