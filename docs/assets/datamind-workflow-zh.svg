<line x1="678" y1="118" x2="713" y2="118" class="arrow" marker-end="url(#arrow)"/>
<line x1="1003" y1="118" x2="1038" y2="118" class="arrow" marker-end="url(#arrow)"/>
<path d="M 1183 171 V 236 H 160 V 292" class="arrow" marker-end="url(#arrow)"/>
<line x1="238" y1="357" x2="250" y2="357" class="arrow" marker-end="url(#arrow)"/>
<line x1="466" y1="357" x2="478" y2="357" class="arrow" marker-end="url(#arrow)"/>
<line x1="694" y1="357" x2="706" y2="357" class="arrow" marker-end="url(#arrow)"/>
