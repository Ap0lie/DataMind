<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="685" viewBox="0 0 1400 685" role="img" aria-labelledby="title desc">
  <title id="title">DataMind 端到端流程</title>
  <desc id="desc">从数据准备到自主分析、验证、报告和 Kimi 后续操作的完整流程。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748b"/>
    </marker>
    <style>
      text { font-family: Inter, "Segoe UI", "Microsoft YaHei", Arial, sans-serif; }
      .layer { font-size: 18px; font-weight: 700; fill: #0f172a; }
      .card-title { font-weight: 700; }
      .card-detail { font-size: 15px; font-weight: 500; }
      .arrow { stroke: #64748b; stroke-width: 2; fill: none; }
      .arrow.muted { stroke: #94a3b8; stroke-width: 1.7; }
      .shared-connection { stroke: #64748b; stroke-width: 1.7; fill: none; }
      .flow-label { font-size: 14px; font-weight: 700; fill: #475569; }
      .service-bus { font-size: 14px; font-weight: 700; fill: #334155; }
    </style>
  </defs>
  <rect width="1400" height="685" fill="#ffffff"/>

    <rect x="16" y="16" width="1368" height="180" rx="8" fill="#f8fffc" stroke="#dbe4ef"/>
    <text x="34" y="43" class="layer">1 · 准备可信数据</text>

    <rect x="16" y="211" width="1368" height="260" rx="8" fill="#fbfdfc" stroke="#dbe4ef"/>
    <text x="34" y="238" class="layer">2 · 有边界的自主分析</text>

    <rect x="16" y="486" width="1368" height="183" rx="8" fill="#fafbff" stroke="#dbe4ef"/>
    <text x="34" y="513" class="layer">3 · 交付证据化答案</text>

    <rect x="63" y="66" width="290" height="105" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="208" y="102" text-anchor="middle" class="card-title" font-size="19" fill="#064e3b">导入文件</text>
    <text text-anchor="middle" class="card-detail" fill="#064e3b"><tspan x="208" y="132">批量 · 拖拽上传</tspan><tspan x="208" y="153">大文件落盘暂存</tspan></text>

    <rect x="388" y="66" width="290" height="105" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
    <text x="533" y="102" text-anchor="middle" class="card-title" font-size="19" fill="#14532d">清洗 Loop</text>
    <text text-anchor="middle" class="card-detail" fill="#14532d"><tspan x="533" y="132">规则 · LLM · Hybrid</tspan><tspan x="533" y="153">修复 · 质量门禁</tspan></text>

    <rect x="713" y="66" width="290" height="105" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
    <text x="858" y="102" text-anchor="middle" class="card-title" font-size="19" fill="#78350f">可信清洗版本</text>
    <text text-anchor="middle" class="card-detail" fill="#78350f"><tspan x="858" y="132">Diff · 激活 · 回滚</tspan><tspan x="858" y="153">失败不覆盖当前版本</tspan></text>

    <rect x="1038" y="66" width="290" height="105" rx="8" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
    <text x="1183" y="102" text-anchor="middle" class="card-title" font-size="19" fill="#1e3a8a">画像与语义</text>
    <text text-anchor="middle" class="card-detail" fill="#1e3a8a"><tspan x="1183" y="132">漂移 · 角色 · 指标</tspan><tspan x="1183" y="153">实体关系图</tspan></text>

    <rect x="40" y="261" width="240" height="130" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
    <text x="160" y="297" text-anchor="middle" class="card-title" font-size="18" fill="#14532d">Planner</text>
    <text text-anchor="middle" class="card-detail" fill="#14532d"><tspan x="160" y="327">问题 · 范围 · 粒度</tspan><tspan x="160" y="348">分析契约</tspan></text>

    <rect x="310" y="261" width="240" height="130" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
    <text x="430" y="297" text-anchor="middle" class="card-title" font-size="18" fill="#14532d">工具 Loop</text>
    <text text-anchor="middle" class="card-detail" fill="#14532d"><tspan x="430" y="327">安全 SQL · Python</tspan><tspan x="430" y="348">证据 Artifact</tspan></text>

    <rect x="580" y="261" width="240" height="130" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
    <text x="700" y="297" text-anchor="middle" class="card-title" font-size="18" fill="#78350f">验证器</text>
    <text text-anchor="middle" class="card-detail" fill="#78350f"><tspan x="700" y="327">Join 粒度 · 统计</tspan><tspan x="700" y="348">数值证据</tspan></text>

    <rect x="850" y="261" width="240" height="130" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
    <text x="970" y="297" text-anchor="middle" class="card-title" font-size="18" fill="#78350f">Reviewer</text>
    <text text-anchor="middle" class="card-detail" fill="#78350f"><tspan x="970" y="327">对抗审查</tspan><tspan x="970" y="348">失败触发重规划</tspan></text>

    <rect x="1120" y="261" width="240" height="130" rx="8" fill="#faf5ff" stroke="#c084fc" stroke-width="2"/>
    <text x="1240" y="297" text-anchor="middle" class="card-title" font-size="18" fill="#581c87">报告 Loop</text>
    <text text-anchor="middle" class="card-detail" fill="#581c87"><tspan x="1240" y="327">草稿 · 修复 · 验证</tspan><tspan x="1240" y="348">幂等提交</tspan></text>

    <rect x="200" y="536" width="300" height="110" rx="8" fill="#faf5ff" stroke="#c084fc" stroke-width="2"/>
    <text x="350" y="572" text-anchor="middle" class="card-title" font-size="19" fill="#581c87">报告资产</text>
    <text text-anchor="middle" class="card-detail" fill="#581c87"><tspan x="350" y="602">图表 · 血缘 · 版本</tspan><tspan x="350" y="623">HTML · Markdown · PDF</tspan></text>

    <rect x="550" y="536" width="300" height="110" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="700" y="572" text-anchor="middle" class="card-title" font-size="19" fill="#064e3b">Kimi 助手</text>
    <text text-anchor="middle" class="card-detail" fill="#064e3b"><tspan x="700" y="602">检索已引用证据</tspan><tspan x="700" y="623">问答 · 执行 · 附件</tspan></text>

    <rect x="900" y="536" width="300" height="110" rx="8" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
    <text x="1050" y="572" text-anchor="middle" class="card-title" font-size="19" fill="#1e3a8a">后续行动</text>
    <text text-anchor="middle" class="card-detail" fill="#1e3a8a"><tspan x="1050" y="602">追问 · 重新分析</tspan><tspan x="1050" y="623">可审计 · 可恢复</tspan></text>
<line x1="353" y1="118" x2="388" y2="118" class="arrow" marker-end="url(#arrow)"/>
<line x1="678" y1="118" x2="713" y2="118" class="arrow" marker-end="url(#arrow)"/>
<line x1="1003" y1="118" x2="1038" y2="118" class="arrow" marker-end="url(#arrow)"/>
<path d="M 1183 171 V 203 H 160 V 261" class="arrow" marker-end="url(#arrow)"/>
<line x1="280" y1="326" x2="310" y2="326" class="arrow" marker-end="url(#arrow)"/>
<line x1="550" y1="326" x2="580" y2="326" class="arrow" marker-end="url(#arrow)"/>
<line x1="820" y1="326" x2="850" y2="326" class="arrow" marker-end="url(#arrow)"/>
<line x1="1090" y1="326" x2="1120" y2="326" class="arrow" marker-end="url(#arrow)"/>
<path d="M 1240 391 C 1240 425, 160 425, 160 391" class="arrow muted" stroke-dasharray="7 7" marker-end="url(#arrow)"/>
<text x="700" y="418" text-anchor="middle" class="flow-label">有边界的修复 / 重规划</text>
<rect x="230" y="439" width="940" height="24" rx="8" fill="#eef2f7" stroke="#94a3b8"/>
<text x="700" y="456" text-anchor="middle" class="service-bus">持久任务 · Checkpoint · 有序 SSE 事件</text>
<path d="M 1360 326 H 1372 V 479 H 350 V 536" class="arrow" marker-end="url(#arrow)"/>
<line x1="500" y1="591" x2="550" y2="591" class="arrow" marker-end="url(#arrow)"/>
<line x1="850" y1="591" x2="900" y2="591" class="arrow" marker-end="url(#arrow)"/>
</svg>