<line x1="1150" y1="357" x2="1162" y2="357" class="arrow" marker-end="url(#arrow)"/>
<path d="M 1270 422 C 1270 456, 130 456, 130 422" class="arrow muted" stroke-dasharray="7 7" marker-end="url(#arrow)"/>
<text x="700" y="449" text-anchor="middle" class="flow-label">有边界的修复 / 重规划</text>
<rect x="230" y="470" width="940" height="24" rx="8" fill="#eef2f7" stroke="#94a3b8"/>
<text x="700" y="487" text-anchor="middle" class="service-bus">持久任务 · Checkpoint · 有序 SSE 事件</text>
<path d="M 1360 357 H 1372 V 510 H 350 V 567" class="arrow" marker-end="url(#arrow)"/>
<line x1="500" y1="622" x2="550" y2="622" class="arrow" marker-end="url(#arrow)"/>
