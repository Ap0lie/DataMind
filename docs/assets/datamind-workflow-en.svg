<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="716" viewBox="0 0 1400 716" role="img" aria-labelledby="title desc">
  <title id="title">DataMind end-to-end workflow</title>
  <desc id="desc">Data preparation, bounded autonomous analysis, verification, reporting, and Kimi follow-up.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748b"/>
    </marker>
    <style>
      text { font-family: Inter, "Segoe UI", "Microsoft YaHei", Arial, sans-serif; }
      .layer { font-size: 18px; font-weight: 700; fill: #0f172a; }
      .card-title { font-weight: 700; }
      .card-detail { font-size: 15px; font-weight: 500; }
      .arrow { stroke: #64748b; stroke-width: 2; fill: none; }
      .arrow.muted { stroke: #94a3b8; stroke-width: 1.7; }
      .shared-connection { stroke: #64748b; stroke-width: 1.7; fill: none; }
      .flow-label { font-size: 14px; font-weight: 700; fill: #475569; }
      .service-bus { font-size: 14px; font-weight: 700; fill: #334155; }
    </style>
  </defs>
  <rect width="1400" height="716" fill="#ffffff"/>

    <rect x="16" y="16" width="1368" height="180" rx="8" fill="#f8fffc" stroke="#dbe4ef"/>
    <text x="34" y="43" class="layer">1 · Prepare trusted data</text>
<rect x="230" y="204" width="940" height="28" rx="8" fill="#eff6ff" stroke="#60a5fa"/>
<text x="700" y="223" text-anchor="middle" class="service-bus" fill="#1e3a8a">Every model call · Node Harness → budget evaluation → deterministic reduction → Router gate</text>

    <rect x="16" y="242" width="1368" height="260" rx="8" fill="#fbfdfc" stroke="#dbe4ef"/>
    <text x="34" y="269" class="layer">2 · Analyze with bounded loops</text>

    <rect x="16" y="517" width="1368" height="183" rx="8" fill="#fafbff" stroke="#dbe4ef"/>
    <text x="34" y="544" class="layer">3 · Deliver evidence-backed answers</text>

    <rect x="63" y="66" width="290" height="105" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="208" y="102" text-anchor="middle" class="card-title" font-size="19" fill="#064e3b">Import files</text>
    <text text-anchor="middle" class="card-detail" fill="#064e3b"><tspan x="208" y="132">Batch · Drag and drop</tspan><tspan x="208" y="153">Disk-backed staging</tspan></text>

    <rect x="388" y="66" width="290" height="105" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
    <text x="533" y="102" text-anchor="middle" class="card-title" font-size="19" fill="#14532d">Cleaning Loop</text>
    <text text-anchor="middle" class="card-detail" fill="#14532d"><tspan x="533" y="132">Rules · LLM · Hybrid</tspan><tspan x="533" y="153">Repair · Quality gate</tspan></text>

    <rect x="713" y="66" width="290" height="105" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
    <text x="858" y="102" text-anchor="middle" class="card-title" font-size="19" fill="#78350f">Validated versions</text>
    <text text-anchor="middle" class="card-detail" fill="#78350f"><tspan x="858" y="132">Diff · Activate · Rollback</tspan><tspan x="858" y="153">No unsafe overwrite</tspan></text>

    <rect x="1038" y="66" width="290" height="105" rx="8" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
    <text x="1183" y="102" text-anchor="middle" class="card-title" font-size="19" fill="#1e3a8a">Profile &amp; semantics</text>
    <text text-anchor="middle" class="card-detail" fill="#1e3a8a"><tspan x="1183" y="132">Drift · Roles · Metrics</tspan><tspan x="1183" y="153">Relationship graph</tspan></text>

    <rect x="22" y="292" width="216" height="130" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
    <text x="130" y="328" text-anchor="middle" class="card-title" font-size="18" fill="#78350f">Intent Guard</text>
    <text text-anchor="middle" class="card-detail" fill="#78350f"><tspan x="130" y="358">Compile · Validate</tspan><tspan x="130" y="379">Repair · Confirm</tspan></text>

    <rect x="250" y="292" width="216" height="130" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
    <text x="358" y="328" text-anchor="middle" class="card-title" font-size="18" fill="#14532d">Planner</text>
    <text text-anchor="middle" class="card-detail" fill="#14532d"><tspan x="358" y="358">Question · Scope · Grain</tspan><tspan x="358" y="379">Analysis contract</tspan></text>

    <rect x="478" y="292" width="216" height="130" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
    <text x="586" y="328" text-anchor="middle" class="card-title" font-size="18" fill="#14532d">Tool Loop</text>
    <text text-anchor="middle" class="card-detail" fill="#14532d"><tspan x="586" y="358">Safe SQL · Python</tspan><tspan x="586" y="379">Evidence artifacts</tspan></text>

    <rect x="706" y="292" width="216" height="130" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
    <text x="814" y="328" text-anchor="middle" class="card-title" font-size="18" fill="#78350f">Verifier</text>
    <text text-anchor="middle" class="card-detail" fill="#78350f"><tspan x="814" y="358">Join grain · Statistics</tspan><tspan x="814" y="379">Numeric evidence</tspan></text>

    <rect x="934" y="292" width="216" height="130" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
    <text x="1042" y="328" text-anchor="middle" class="card-title" font-size="18" fill="#78350f">Reviewer</text>
    <text text-anchor="middle" class="card-detail" fill="#78350f"><tspan x="1042" y="358">Adversarial checks</tspan><tspan x="1042" y="379">Replan on failure</tspan></text>

    <rect x="1162" y="292" width="216" height="130" rx="8" fill="#faf5ff" stroke="#c084fc" stroke-width="2"/>
    <text x="1270" y="328" text-anchor="middle" class="card-title" font-size="18" fill="#581c87">Report Loop</text>
    <text text-anchor="middle" class="card-detail" fill="#581c87"><tspan x="1270" y="358">Draft · Repair · Verify</tspan><tspan x="1270" y="379">Idempotent commit</tspan></text>

    <rect x="200" y="567" width="300" height="110" rx="8" fill="#faf5ff" stroke="#c084fc" stroke-width="2"/>
    <text x="350" y="603" text-anchor="middle" class="card-title" font-size="19" fill="#581c87">Report artifact</text>
    <text text-anchor="middle" class="card-detail" fill="#581c87"><tspan x="350" y="633">Charts · Lineage · Versions</tspan><tspan x="350" y="654">HTML · Markdown · PDF</tspan></text>

    <rect x="550" y="567" width="300" height="110" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="700" y="603" text-anchor="middle" class="card-title" font-size="19" fill="#064e3b">Kimi assistant</text>
    <text text-anchor="middle" class="card-detail" fill="#064e3b"><tspan x="700" y="633">Evidence · Scoped memory</tspan><tspan x="700" y="654">Ask · Execute · Attach</tspan></text>

    <rect x="900" y="567" width="300" height="110" rx="8" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
    <text x="1050" y="603" text-anchor="middle" class="card-title" font-size="19" fill="#1e3a8a">Next action</text>
    <text text-anchor="middle" class="card-detail" fill="#1e3a8a"><tspan x="1050" y="633">Follow-up · Reanalyze</tspan><tspan x="1050" y="654">Audited and recoverable</tspan></text>
