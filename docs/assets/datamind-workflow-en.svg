<text x="700" y="449" text-anchor="middle" class="flow-label">bounded repair / replan</text>
<rect x="230" y="470" width="940" height="24" rx="8" fill="#eef2f7" stroke="#94a3b8"/>
<text x="700" y="487" text-anchor="middle" class="service-bus">Durable jobs · checkpoints · ordered SSE events</text>
<path d="M 1360 357 H 1372 V 510 H 350 V 567" class="arrow" marker-end="url(#arrow)"/>
