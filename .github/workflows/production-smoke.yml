name: DataMind Production Smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "30 18 * * 1"

jobs:
  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      DATAMIND_POSTGRES_PASSWORD: production-smoke-password
      DATAMIND_REDIS_PASSWORD: production-smoke-redis-password
      DATAMIND_PYTHON_RUNNER_SHARED_SECRET: production-smoke-runner-secret
      DATAMIND_PUBLIC_ORIGIN: http://127.0.0.1:5173
      DATAMIND_LLM_PROVIDER: mock
      DATAMIND_DEFAULT_LLM_PROVIDER: mock
      DATAMIND_CLEANING_LLM_PROVIDER: mock
      DATAMIND_PLANNER_LLM_PROVIDER: mock
      DATAMIND_SQL_LLM_PROVIDER: mock
      DATAMIND_PYTHON_LLM_PROVIDER: mock
      DATAMIND_REFLECTION_LLM_PROVIDER: mock
      DATAMIND_REPORT_LLM_PROVIDER: mock
      DATAMIND_REVIEW_LLM_PROVIDER: mock
      DATAMIND_MULTIMODAL_LLM_PROVIDER: mock
      DATAMIND_AGENT_LOOP_PROVIDER: mock
      DATAMIND_ASSISTANT_ENABLED: "false"
      DATAMIND_SEMANTIC_EMBEDDING_ENABLED: "false"
      DATAMIND_SEMANTIC_EMBEDDING_REQUIRED: "false"
      DATAMIND_CLEANING_LOOP_ENABLED: "true"
      DATAMIND_REPORT_LOOP_ENABLED: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build and start production services
        run: docker compose up -d --build postgres redis python-sandbox python-runner migrate api worker

      - name: Verify controlled Python Runner container execution
        run: docker compose exec -T api python -m app.python_runner.smoke

      - name: Run Cookie, cleaning, Celery, Loop and report smoke flow
        run: python scripts/production_smoke.py --timeout 420 --benchmark-output artifacts/benchmarks/production-smoke.json

      - name: Upload production smoke metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: datamind-production-smoke-metrics
          path: artifacts/benchmarks/production-smoke.json
          if-no-files-found: warn

      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=300 api worker postgres redis python-runner

      - name: Stop production services
        if: always()
        run: docker compose down -v --remove-orphans
