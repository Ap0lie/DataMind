name: DataMind CI

on:
  push:
  pull_request:

concurrency:
  group: datamind-ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      DATAMIND_DEFAULT_LLM_PROVIDER: mock
      DATAMIND_PLANNER_LLM_PROVIDER: mock
      DATAMIND_SQL_LLM_PROVIDER: mock
      DATAMIND_PYTHON_LLM_PROVIDER: mock
      DATAMIND_REPORT_LLM_PROVIDER: mock
      DATAMIND_REVIEW_LLM_PROVIDER: mock
      DATAMIND_EXECUTION_BACKEND: local
      DATAMIND_E2E_BROWSER_CHANNEL: chrome

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install backend dependencies
        run: python -m pip install -e ".[dev]"

      - name: Backend lint
        run: python -m ruff check .

      - name: Unit tests
        run: python -m pytest -q --durations=20

      - name: Workflow tests
        run: python -m pytest -o addopts="" -m workflow -q --durations=20

      - name: Integration tests
        run: python -m pytest -o addopts="" -m integration -q --durations=20

      - name: Deterministic release benchmark
        run: python -m app.evaluation.cli run --suite release --output artifacts/benchmarks/release

      - name: Upload release benchmark
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: datamind-release-benchmark
          path: artifacts/benchmarks/release
          if-no-files-found: warn

      - name: Trustworthy memory benchmark
        run: python -m app.evaluation.cli run --suite memory --output artifacts/benchmarks/memory

      - name: Upload memory benchmark
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: datamind-memory-benchmark
          path: artifacts/benchmarks/memory
          if-no-files-found: warn

      - name: Context budget benchmark
        run: python -m app.evaluation.cli run --suite context --output artifacts/benchmarks/context

      - name: Upload context budget benchmark
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: datamind-context-benchmark
          path: artifacts/benchmarks/context
          if-no-files-found: warn

      - name: Tool result context benchmark
        run: python -m app.evaluation.cli run --suite tool-context --output artifacts/benchmarks/tool-context

      - name: Upload tool result context benchmark
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: datamind-tool-context-benchmark
          path: artifacts/benchmarks/tool-context
          if-no-files-found: warn

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/react/package-lock.json

      - name: Install frontend dependencies
        run: npm --prefix frontend/react ci

      - name: Build frontend
        run: npm --prefix frontend/react run build

      - name: Playwright end-to-end tests
        run: npm --prefix frontend/react run test:e2e

      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: datamind-playwright-diagnostics
          path: |
            frontend/react/playwright-report
            frontend/react/test-results
          if-no-files-found: warn
