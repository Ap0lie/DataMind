name: DataMind Scheduled Benchmarks

on:
  workflow_dispatch:
  schedule:
    - cron: "15 18 * * 2"

jobs:
  provider-canary:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      DATAMIND_DEEPSEEK_API_KEY: ${{ secrets.DATAMIND_DEEPSEEK_API_KEY }}
      DATAMIND_KIMI_API_KEY: ${{ secrets.DATAMIND_KIMI_API_KEY }}
      DATAMIND_RATE_LIMITS_ENABLED: "false"

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install benchmark dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run real-provider canary
        shell: bash
        run: |
          if [[ -z "$DATAMIND_DEEPSEEK_API_KEY" || -z "$DATAMIND_KIMI_API_KEY" ]]; then
            echo "Provider benchmark skipped: required GitHub Secrets are not configured."
            exit 0
          fi
          python -m app.evaluation.cli run --suite provider --repeats 3 --output artifacts/benchmarks/provider

      - name: Upload provider benchmark
        if: always() && env.DATAMIND_DEEPSEEK_API_KEY != '' && env.DATAMIND_KIMI_API_KEY != ''
        uses: actions/upload-artifact@v6
        with:
          name: datamind-provider-benchmark
          path: artifacts/benchmarks/provider
          if-no-files-found: warn

  production-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      DATAMIND_POSTGRES_PASSWORD: benchmark-postgres-password
      DATAMIND_REDIS_PASSWORD: benchmark-redis-password
      DATAMIND_PYTHON_RUNNER_SHARED_SECRET: benchmark-runner-secret
      DATAMIND_PUBLIC_ORIGIN: http://127.0.0.1:5173
      DATAMIND_LLM_PROVIDER: mock
      DATAMIND_DEFAULT_LLM_PROVIDER: mock
      DATAMIND_CLEANING_LLM_PROVIDER: mock
      DATAMIND_PLANNER_LLM_PROVIDER: mock
      DATAMIND_SQL_LLM_PROVIDER: mock
      DATAMIND_PYTHON_LLM_PROVIDER: mock
      DATAMIND_REPORT_LLM_PROVIDER: mock
      DATAMIND_REVIEW_LLM_PROVIDER: mock
      DATAMIND_AGENT_LOOP_PROVIDER: mock
      DATAMIND_ASSISTANT_ENABLED: "false"
      DATAMIND_SEMANTIC_EMBEDDING_ENABLED: "false"
      DATAMIND_SEMANTIC_EMBEDDING_REQUIRED: "false"

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install benchmark dependencies
        run: python -m pip install -e ".[dev]"

      - name: Start production services
        run: docker compose up -d --build postgres redis python-sandbox python-runner migrate api worker

      - name: Run production smoke and capture SSE latency
        run: python scripts/production_smoke.py --origin "$DATAMIND_PUBLIC_ORIGIN" --timeout 420 --benchmark-output artifacts/benchmarks/production-smoke.json

      - name: Run performance benchmark
        run: python -m app.evaluation.cli run --suite performance --backend compose --output artifacts/benchmarks/performance

      - name: Run resilience benchmark
        run: python -m app.evaluation.cli run --suite resilience --backend compose --output artifacts/benchmarks/resilience

      - name: Upload production benchmark
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: datamind-production-benchmark
          path: artifacts/benchmarks
          if-no-files-found: warn

      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=300 api worker postgres redis python-runner

      - name: Stop production services
        if: always()
        run: docker compose down -v --remove-orphans
